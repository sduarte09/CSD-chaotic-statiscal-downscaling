[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csd"
version = "0.1.0"
description = "Chaotic Statistical Downscaling: tested building blocks of the CSD method"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Santiago Duarte"}]
keywords = ["downscaling", "precipitation", "chaos", "hydroinformatics", "synchronization"]
dependencies = [
    "numpy",
    "pandas",
    "scipy",  # NetCDF reading/writing (classic format) and numerics
    # phase-space reconstruction and false-nearest-neighbour tools
    "snlda @ git+https://github.com/sduarte09/SNLDA.git",
]

[project.optional-dependencies]
test = ["pytest"]
netcdf = ["netCDF4"]  # optional: NetCDF4/HDF5 files; classic NetCDF works with scipy alone
notebook = ["jupyter", "matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
